nggaraan dua tahun sekali.\\n\\nKedua, Gebyar Brawijaya Qur’ani Nasional (GBQN) diselenggarakan pada tahun ketika MTQMN tidak berlangsung. GBQN merupakan kompetisi Al-Qur’an tingkat nasional yang juga menjadi sarana pengenalan Universitas Brawijaya kepada siswa SMA/sederajat sekaligus menjaring calon mahasiswa berprestasi di bidang Al-Qur’an.\\n\\nKetiga, MTQ Universitas Brawijaya (MTQ UB) merupakan kompetisi internal tingkat Universitas yang diselenggarakan setiap tahun. Kegiatan ini berfungsi sebagai wadah penjaringan dan pembinaan mahasiswa berprestasi untuk mempersiapkan kafilah Universitas Brawijaya yang akan berlaga di MTQMN.\"},{\"_id\":\"kegiatan-lain\",\"pertanyaan\":\"Apakah UKM Seni Religi hanya berfokus pada pembinaan prestasi, atau juga memiliki kegiatan lainnya?\",\"jawaban\":\"Tentu tidak. UKM Seni Religi tidak hanya berfokus pada pembinaan prestasi dan kompetisi Al-Qur’an, tetapi juga memiliki banyak kegiatan keagamaan, kebersamaan, dan pengembangan organisasi.\\n\\nBeberapa di antaranya adalah YKS (Yuk Kita Sholawatan) yang dilaksanakan setiap malam Jumat secara bergiliran di masjid-masjid fakultas, 3N (Ngaji, Ngopi, Njagong) berupa kegiatan khotmil Qur’an di masjid fakultas, Safari Khotmil, Wisata Religi, Muktamar, Harlah, serta kegiatan sowan kepada pembina.\"}],\"dataUpdateCount\":1,\"dataUpdatedAt\":1795197472786,\"error\":null,\"errorUpdateCount\":0,\"errorUpdatedAt\":0,\"fetchFailureCount\":0,\"fetchFailureReason\":null,\"fetchMeta\":null,\"isInvalidated\":false,\"status\":\"success\",\"fetchStatus\":\"idle\"},\"queryKey\":[\"faq\"],\"queryHash\":\"[\\\"faq\\\"]\"}]},\"children\":[\"$\",\"$L25\",null,{}]}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"26:I[27201,[\"$3\",\"$4\",\"$5\"],\"IconMark\"]\n15:null\n1c:[[\"$\",\"title\",\"0\",{\"children\":\"Sen
